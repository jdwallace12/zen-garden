<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zen Garden – 3D Garden Studio</title>
    <meta name="description" content="A tranquil 3D garden creation studio built with Three.js. Sculpt moss mounds, carve reflective ponds, plant trees, and arrange rocks." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
      <!-- Header Banner -->
      <header class="zen-header">
        <div class="logo-group">
          <div>
            <button id="btn-meditate" class="zen-btn zen-btn-outline" title="Hide interface for meditation (Press ESC to return)">
            <span class="btn-icon">🪷</span> Meditate/Full Screen
          </button>
          <button id="btn-singing-bowl" class="zen-btn zen-btn-outline" title="Ring Tibetan singing bowl for mindfulness">
            <span class="btn-icon">🔔</span> Ring Bowl
          </button>
          </div>
        </div>

        <div class="header-actions">
          <button id="btn-audio-toggle" class="zen-btn zen-btn-icon" title="Toggle Soundscape">
            <span id="audio-icon">🔊</span>
          </button>
          <div class="save-load-group">
            <button id="btn-save-garden" class="zen-btn zen-btn-save" title="Save your garden as a JSON file">
              <span class="btn-icon">💾</span> Save
            </button>
            <button id="btn-load-garden" class="zen-btn zen-btn-load" title="Load a previously saved garden from a JSON file">
              <span class="btn-icon">📂</span> Load
            </button>
          </div>
        </div>
      </header>

      <!-- Left Sidebar: Tools & Actions -->
      <aside class="zen-sidebar left-sidebar" id="left-sidebar">
        <button class="drawer-toggle drawer-toggle-left" id="toggle-left" title="Toggle tools panel">
          <span class="drawer-toggle-icon">◀</span>
        </button>
        <!-- Garden Presets -->
        <div class="panel-section">
          <h2 class="section-title">Garden Presets</h2>
          <div class="preset-grid">
            <button class="preset-btn active" data-preset="ryoanji" title="Pristine sand with rock clusters">
              <span class="p-en">Sand Sea</span>
            </button>
            <button class="preset-btn" data-preset="sanctuary" title="Sculpted moss mounds, rolling hills, pines & maples">
              <span class="p-en">Moss Hills</span>
            </button>
            <button class="preset-btn" data-preset="koi-pond" title="Reflective pond with swimming fish & cherry blossoms">
              <span class="p-en">Water Pond</span>
            </button>
            <button class="preset-btn" data-preset="procedural" title="Generate a random garden layout">
              <span class="p-en">Randomize</span>
            </button>
            <button class="preset-btn" data-preset="blank" title="Clean flat sand canvas">
              <span class="p-en">Blank Canvas</span>
            </button>
          </div>
        </div>

        <!-- Landscape Sculpt & Carve Tools -->
        <div class="panel-section">
          <h2 class="section-title">Landscape & Carving</h2>
          <div class="tool-grid">
            <button class="tool-btn active" data-tool="sculpt-raise" title="Sculpt lush green moss mounds & hills">
              <span class="tool-icon">⛰️</span>
              <span class="tool-name">Raise Mound</span>
            </button>
            <button class="tool-btn" data-tool="sculpt-lower" title="Carve depressions into earth">
              <span class="tool-icon">⛏️</span>
              <span class="tool-name">Carve Trench</span>
            </button>
            <button class="tool-btn" data-tool="water-pool" title="Carve deep pond filled with reflective water">
              <span class="tool-icon">💧</span>
              <span class="tool-name">Carve Pond</span>
            </button>
            <button class="tool-btn" data-tool="paint-moss" title="Paint velvety emerald moss cushions">
              <span class="tool-icon">🍃</span>
              <span class="tool-name">Paint Moss</span>
            </button>
            <button class="tool-btn" data-tool="paint-sand" title="Brush fine cream zen sand">
              <span class="tool-icon">✨</span>
              <span class="tool-name">Restore Sand</span>
            </button>
            <button class="tool-btn" data-tool="smooth" title="Gently smooth & level terrain">
              <span class="tool-icon">〰️</span>
              <span class="tool-name">Smooth</span>
            </button>
          </div>

          <!-- Tool Parameters -->
          <div class="tool-parameters">
            <div class="param-row">
              <label for="brush-size">Size: <span id="val-brush-size">3.0m</span></label>
              <input type="range" id="brush-size" min="1.0" max="6.5" step="0.2" value="3.0" />
            </div>
            <div class="param-row">
              <label for="brush-strength">Intensity: <span id="val-brush-strength">50%</span></label>
              <input type="range" id="brush-strength" min="0.1" max="1.0" step="0.05" value="0.5" />
            </div>
          </div>
        </div>

        <!-- History Actions -->
        <div class="history-controls">
          <button id="btn-undo" class="zen-btn-sm" title="Undo (Ctrl+Z)">↺ Undo</button>
          <button id="btn-redo" class="zen-btn-sm" title="Redo (Ctrl+Y)">↻ Redo</button>
          <button id="btn-clear-sand" class="zen-btn-sm text-danger" title="Flatten all terrain back to calm sand">Flatten Terrain</button>
        </div>
      </aside>

      <!-- Right Sidebar: Elements Catalog -->
      <aside class="zen-sidebar right-sidebar" id="right-sidebar">
        <button class="drawer-toggle drawer-toggle-right" id="toggle-right" title="Toggle elements panel">
          <span class="drawer-toggle-icon">▶</span>
        </button>
        <div class="panel-section">
          <h2 class="section-title">Place Elements</h2>
          
          <!-- Category Tabs -->
          <div class="catalog-tabs">
            <button class="cat-tab active" data-cat="rocks">Rocks</button>
            <button class="cat-tab" data-cat="flora">Trees & Flora</button>
            <button class="cat-tab" data-cat="traditional">Architecture</button>
          </div>

          <!-- Element Cards -->
          <div class="element-list" id="element-list">
            <!-- Populated dynamically via JS -->
          </div>

          <!-- Placement Controls -->
          <div class="placement-options">
            <div class="param-row">
              <label for="elem-scale">Scale: <span id="val-elem-scale">1.0x</span></label>
              <input type="range" id="elem-scale" min="0.5" max="2.2" step="0.1" value="1.0" />
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="chk-auto-moss" checked />
              <label for="chk-auto-moss">Nest stones in moss bedding</label>
            </div>
            <div class="delete-mode-row">
              <button id="btn-delete-mode" class="zen-btn-sm full-width" title="Click any placed element to remove it">
                🗑️ Remove Element Tool
              </button>
            </div>
          </div>
        </div>

        <!-- Atmosphere & Time of Day -->
        <div class="panel-section">
          <h2 class="section-title">Atmosphere</h2>
          <div class="tod-grid">
            <button class="tod-btn" data-time="morning" title="Morning light">
              <span>🌅</span> Morning
            </button>
            <button class="tod-btn active" data-time="noon" title="Bright sunlight">
              <span>☀️</span> Noon
            </button>
            <button class="tod-btn" data-time="sunset" title="Twilight sunset">
              <span>🌇</span> Sunset
            </button>
            <button class="tod-btn" data-time="night" title="Moonlit night">
              <span>🌙</span> Night
            </button>
          </div>

          <!-- Weather & Snow Precipitation Toggle -->
          <div class="weather-toggle-row">
            <button id="btn-toggle-snow" class="snow-toggle-btn active" title="Toggle gentle falling snow particles on or off">
              <span class="snow-icon">❄️</span>
              <span class="snow-label">Falling Snow: <strong id="snow-status-text">On</strong></span>
            </button>
          </div>

          <!-- Camera Views -->
          <div class="camera-grid">
            <button class="cam-btn active" data-cam="orbit" title="Free Orbit View">
              🎥 Orbit View
            </button>
            <button class="cam-btn" data-cam="eye" title="Eye-level ground view">
              🪑 Ground View
            </button>
            <button class="cam-btn" data-cam="top" title="Top-Down Garden Plan View">
              📐 Plan View
            </button>
          </div>
        </div>
      </aside>

      <!-- Bottom Hint Bar -->
      <footer class="zen-footer">
        <div class="hint-text">
          <span class="hint-icon">💡</span>
          <span id="interaction-hint">Click & drag to sculpt moss mounds or carve ponds. Arrow keys / WASD to move camera. Right-click to rotate view.</span>
        </div>
      </footer>
    </div>

    <!-- Exit Meditation Mode Floating Button -->
    <button id="btn-exit-meditate" class="floating-exit-btn hidden" title="Exit meditation view (or press ESC)">
      ESC ✕ Exit Meditation
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
